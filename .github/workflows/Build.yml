name: Modu Derle

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Java 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Gradle 8.8 Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.8
    - name: Gradle Wrapper Oluştur
      run: gradle wrapper --gradle-version 8.8
    - name: Gradle ile Derle
      run: ./gradlew build
    - name: Jar Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: emberfall-mod
        path: build/libs/*.jar
